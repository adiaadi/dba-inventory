services:
  proxy:
    image: nginx:1.27-alpine
    container_name: dba_inventory_proxy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d/dba-inventory.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d/dba-inventory-ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      - "${TLS_CERT_FILE_HOST:-./certs/db-inv.bnkc.com.crt}:/etc/nginx/certs/db-inv.bnkc.com.crt:ro"
      - "${TLS_KEY_FILE_HOST:-./certs/db-inv.bnkc.com.key}:/etc/nginx/certs/db-inv.bnkc.com.key:ro"
