<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ ui_text(request, "auth.login_title", "DATABASE INVENTORY") }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body class="portal-login-body">
  <main class="portal-login-shell">
    <section class="portal-login-panel">
      <div class="portal-login-panel-inner">
        <img class="portal-login-logo" src="/static/img/bnk_logo_246x164.png" alt="BNK Commercial Bank">
        <div class="portal-login-copy">
          <h1>{{ ui_text(request, "auth.login_title", "DATABASE INVENTORY") }}</h1>
        </div>
        {% if error %}
          <div class="alert alert-danger py-2" role="alert">
            {{ ui_text(request, "auth.invalid_login", "Invalid login or password.") }}
          </div>
        {% endif %}
        <form method="post" action="/login" class="portal-login-form">
          <input type="hidden" name="next" value="{{ next_url }}">
          <label class="form-label">
            Login
            <input class="form-control" name="username" autocomplete="username" required autofocus>
          </label>
          <label class="form-label">
            Password
            <input class="form-control" type="password" name="password" autocomplete="current-password" required>
          </label>
          <button class="btn btn-primary w-100" type="submit">
            <i class="bi bi-box-arrow-in-right"></i> Login
          </button>
        </form>
        <div class="portal-login-footer">&copy; 2026. BNK Commercial Bank</div>
      </div>
    </section>
    <section class="portal-login-hero" aria-label="Database infrastructure illustration">
      <img src="/static/img/login-infrastructure-hero.png" alt="">
      <div class="portal-login-db-logos" aria-label="Supported database platforms">
        <div class="portal-login-db-logo portal-login-db-logo-oracle">
          <img src="/static/img/oracle.png" alt="Oracle">
          <span>Oracle</span>
        </div>
        <div class="portal-login-db-logo">
          <img src="/static/img/postgresql.png" alt="PostgreSQL">
          <span>PostgreSQL</span>
        </div>
        <div class="portal-login-db-logo">
          <img src="/static/img/sqlserver.png" alt="SQLServer">
          <span>SQLServer</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
